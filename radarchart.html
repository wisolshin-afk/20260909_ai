<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>신입사원 면접 역량 평가</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --grid: #dfe7f3;
        --candidate: #2563eb;
        --candidate-fill: rgba(37, 99, 235, 0.25);
        --ideal: #ef4444;
        --ideal-fill: rgba(239, 68, 68, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        font-family: Arial, sans-serif;
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 40px auto;
        padding: 24px;
      }

      .panel {
        background: var(--card);
        border-radius: 18px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
        padding: 24px;
      }

      h1 {
        text-align: center;
        margin: 0 0 24px;
        font-size: 32px;
      }

      .content {
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 24px;
        align-items: center;
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .control-row {
        display: grid;
        grid-template-columns: 160px 1fr 52px;
        align-items: center;
        gap: 12px;
        background: #f8fafc;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 10px 12px;
      }

      .label {
        font-weight: 600;
        font-size: 15px;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--candidate);
      }

      .score {
        text-align: right;
        font-weight: 700;
        color: var(--text);
      }

      .chart-box {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 520px;
      }

      canvas {
        width: 100%;
        max-width: 620px;
        height: auto;
        display: block;
      }

      .legend {
        display: flex;
        justify-content: center;
        gap: 22px;
        margin-top: 10px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 14px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <h1>신입사원 면접 역량 평가</h1>

        <div class="content">
          <div class="controls" id="controls"></div>

          <div>
            <div class="chart-box">
              <canvas id="radarChart" width="620" height="620"></canvas>
            </div>
            <div class="legend">
              <div class="legend-item"><span class="dot" style="background: var(--candidate)"></span>지원자 점수</div>
              <div class="legend-item"><span class="dot" style="background: var(--ideal)"></span>이상적 기준</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const categories = [
        { name: '직무 전문성', key: 'expertise' },
        { name: '커뮤니케이션 능력', key: 'communication' },
        { name: '팀워크 및 협업', key: 'teamwork' },
        { name: '문제 해결력', key: 'problemSolving' },
        { name: '적극성 및 주도성', key: 'initiative' },
        { name: '조직 적응력', key: 'adaptability' }
      ];

      const candidateScores = {
        expertise: 82,
        communication: 74,
        teamwork: 78,
        problemSolving: 80,
        initiative: 75,
        adaptability: 70
      };

      const idealScores = {
        expertise: 90,
        communication: 85,
        teamwork: 88,
        problemSolving: 90,
        initiative: 85,
        adaptability: 80
      };

      const controlsContainer = document.getElementById('controls');

      categories.forEach((item) => {
        const row = document.createElement('div');
        row.className = 'control-row';

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = item.name;

        const input = document.createElement('input');
        input.type = 'range';
        input.min = '0';
        input.max = '100';
        input.value = candidateScores[item.key];
        input.addEventListener('input', (event) => {
          candidateScores[item.key] = Number(event.target.value);
          updateScoreDisplay();
          drawChart();
        });

        const score = document.createElement('div');
        score.className = 'score';
        score.id = `${item.key}-value`;
        score.textContent = candidateScores[item.key];

        row.appendChild(label);
        row.appendChild(input);
        row.appendChild(score);
        controlsContainer.appendChild(row);
      });

      function updateScoreDisplay() {
        categories.forEach((item) => {
          const valueEl = document.getElementById(`${item.key}-value`);
          valueEl.textContent = candidateScores[item.key];
        });
      }

      const canvas = document.getElementById('radarChart');
      const ctx = canvas.getContext('2d');

      function drawChart() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = 210;
        const levels = 5;
        const angleStep = (Math.PI * 2) / categories.length;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(centerX, centerY);

        for (let level = 1; level <= levels; level++) {
          ctx.beginPath();
          for (let i = 0; i < categories.length; i++) {
            const angle = -Math.PI / 2 + i * angleStep;
            const r = (radius / levels) * level;
            const x = Math.cos(angle) * r;
            const y = Math.sin(angle) * r;

            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.strokeStyle = '#dfe7f3';
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        for (let i = 0; i < categories.length; i++) {
          const angle = -Math.PI / 2 + i * angleStep;
          const x = Math.cos(angle) * radius;
          const y = Math.sin(angle) * radius;

          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(x, y);
          ctx.strokeStyle = '#dfe7f3';
          ctx.stroke();

          const labelX = Math.cos(angle) * (radius + 30);
          const labelY = Math.sin(angle) * (radius + 30);
          ctx.fillStyle = '#374151';
          ctx.font = '13px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          const words = categories[i].name.split(' ');
          if (words.length > 2) {
            const first = words.slice(0, 2).join(' ');
            const second = words.slice(2).join(' ');
            ctx.fillText(first, labelX, labelY - 8);
            ctx.fillText(second, labelX, labelY + 10);
          } else {
            ctx.fillText(categories[i].name, labelX, labelY);
          }
        }

        const valueToPoint = (value, i) => {
          const angle = -Math.PI / 2 + i * angleStep;
          const r = (value / 100) * radius;
          return {
            x: Math.cos(angle) * r,
            y: Math.sin(angle) * r
          };
        };

        const idealPoints = categories.map((item, i) => valueToPoint(idealScores[item.key], i));
        ctx.beginPath();
        idealPoints.forEach((point, index) => {
          if (index === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        });
        ctx.closePath();
        ctx.fillStyle = 'rgba(239, 68, 68, 0.08)';
        ctx.fill();
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        const candidatePoints = categories.map((item, i) => valueToPoint(candidateScores[item.key], i));
        ctx.beginPath();
        candidatePoints.forEach((point, index) => {
          if (index === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        });
        ctx.closePath();
        ctx.fillStyle = 'rgba(37, 99, 235, 0.25)';
        ctx.fill();
        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 3;
        ctx.stroke();

        candidatePoints.forEach((point) => {
          ctx.beginPath();
          ctx.arc(point.x, point.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = '#2563eb';
          ctx.fill();
        });

        ctx.restore();

        ctx.fillStyle = '#1f2937';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('0', 20, canvas.height - 20);
        ctx.fillText('100', canvas.width - 42, 20);
      }

      updateScoreDisplay();
      drawChart();
    </script>
  </body>
</html>
